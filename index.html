<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3a82"><link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="logo.png">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Japon 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: carnet de voyage japonais — bandeau seigaiha indigo, papier washi, tampons hanko vermillon, onglets kanji en bas, bouton + flottant */
:root{
  --washi:#f5efe2; --paper:#fffbf3; --sumi:#2b2521; --muted:#7a6d60; --line:#e5dac6; --soft:#efe6d4;
  --shu:#c63a22; --shu-soft:#f8e3dc; --ai:#24386a; --ai-2:#3a5290; --link:#2d4f9c;
  --osaka:#d4612a; --hiroshima:#4c8758; --kyoto:#7b3f8e; --tokyo:#2d4f9c;
  --good:#4c8758; --meh:#b98a2b; --bad:#c63a22; --onink:#fffbf3;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --washi:#18151a; --paper:#221e24; --sumi:#f1e9dc; --muted:#a99c8e; --line:#3a3338; --soft:#2c2730;
  --shu:#ec6a4f; --shu-soft:#3b2421; --ai:#1c2a52; --ai-2:#2c3f73; --link:#8fa8ec;
  --osaka:#f08a52; --hiroshima:#79b886; --kyoto:#bb84cc; --tokyo:#7f9ce6;
  --good:#79b886; --meh:#e0b55a; --bad:#ec6a4f; --onink:#fffbf3; color-scheme:dark}}
:root[data-theme="dark"]{
  --washi:#18151a; --paper:#221e24; --sumi:#f1e9dc; --muted:#a99c8e; --line:#3a3338; --soft:#2c2730;
  --shu:#ec6a4f; --shu-soft:#3b2421; --ai:#1c2a52; --ai-2:#2c3f73; --link:#8fa8ec;
  --osaka:#f08a52; --hiroshima:#79b886; --kyoto:#bb84cc; --tokyo:#7f9ce6;
  --good:#79b886; --meh:#e0b55a; --bad:#ec6a4f; --onink:#fffbf3; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--washi);color:var(--sumi)}
body{font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0}
.seigaiha{background-color:var(--ai);background-image:
 radial-gradient(circle at 100% 150%,var(--ai) 24%,var(--ai-2) 24%,var(--ai-2) 28%,var(--ai) 28%,var(--ai) 36%,var(--ai-2) 36%,var(--ai-2) 40%,transparent 40%,transparent),
 radial-gradient(circle at 0 150%,var(--ai) 24%,var(--ai-2) 24%,var(--ai-2) 28%,var(--ai) 28%,var(--ai) 36%,var(--ai-2) 36%,var(--ai-2) 40%,transparent 40%,transparent),
 radial-gradient(circle at 50% 100%,var(--ai-2) 10%,var(--ai) 10%,var(--ai) 23%,var(--ai-2) 23%,var(--ai-2) 30%,var(--ai) 30%,var(--ai) 43%,var(--ai-2) 43%,var(--ai-2) 50%,var(--ai) 50%,var(--ai) 63%,var(--ai-2) 63%,var(--ai-2) 71%,transparent 71%,transparent),
 radial-gradient(circle at 100% 50%,var(--ai-2) 5%,var(--ai) 5%,var(--ai) 15%,var(--ai-2) 15%,var(--ai-2) 20%,var(--ai) 20%,var(--ai) 29%,var(--ai-2) 29%,var(--ai-2) 34%,var(--ai) 34%,var(--ai) 44%,var(--ai-2) 44%,var(--ai-2) 49%,transparent 49%,transparent),
 radial-gradient(circle at 0 50%,var(--ai-2) 5%,var(--ai) 5%,var(--ai) 15%,var(--ai-2) 15%,var(--ai-2) 20%,var(--ai) 20%,var(--ai) 29%,var(--ai-2) 29%,var(--ai-2) 34%,var(--ai) 34%,var(--ai) 44%,var(--ai-2) 44%,var(--ai-2) 49%,transparent 49%,transparent);
 background-size:64px 32px}
header.top{margin-inline:-16px;padding:18px 16px 16px;color:var(--onink)}
.toprow{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.hanko{width:44px;height:44px;flex:none;border-radius:50%;background:var(--shu);color:var(--onink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 0 0 3px var(--onink)}
h1{font-size:23px;line-height:1.1;color:var(--onink)}
.top .sub{color:var(--onink);opacity:.85}
.me{border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.18);color:var(--onink);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.banner{background:var(--shu-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
section.block{margin-top:22px}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.h2{display:flex;align-items:baseline;gap:8px}
.h2 .kj{font-family:var(--display);color:var(--shu);font-size:15px;font-weight:800}
h2{font-size:19px}
.btn{border:0;border-radius:6px;padding:9px 16px;font-weight:700;background:var(--shu);color:var(--onink);white-space:nowrap}
.btn.ghost{background:var(--paper);color:var(--sumi);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.linkbtn{color:var(--link);background:none;border:0;padding:0;font-size:14px;text-decoration:none;font-weight:700}
.linkbtn.danger{color:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:12px;white-space:nowrap;color:var(--muted);background:var(--paper)}
.chip.city{border-color:var(--c);color:var(--c);font-weight:700}
.chip.ok{border-color:var(--good);color:var(--good)} .chip.todo{border-color:var(--meh);color:var(--meh)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line>div{min-width:0}
.line small{display:block;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.links{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.links a{color:var(--link);text-decoration:none;font-weight:700;font-size:14px}
.hero{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.count{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;color:var(--shu);font-variant-numeric:tabular-nums}
.count small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-top:6px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.route .st{border:1.5px solid var(--c);color:var(--c);border-radius:4px;padding:2px 8px;font-weight:700;background:var(--paper)}
.route i{color:var(--muted);font-style:normal}
.cta{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--shu-soft);border-radius:8px;padding:12px 14px;margin-top:14px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pod{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.pod .rk{font-family:var(--display);font-weight:800;font-size:22px;color:var(--shu)}
.pod.r1{padding-block:18px;border-color:var(--shu)}
.pod b{font-size:13px;overflow-wrap:anywhere}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:8px}
.progress span{display:block;height:100%;background:var(--good)}
.ck{display:flex;align-items:center;gap:10px;padding-block:9px;border-bottom:1px solid var(--line)}
.ck:last-of-type{border-bottom:0}
.box{width:26px;height:26px;flex:none;border-radius:6px;border:2px solid var(--line);background:var(--paper);color:var(--onink);font-weight:800;display:grid;place-items:center;padding:0}
.ck.done .box{background:var(--good);border-color:var(--good)}
.cktext{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;font-size:14px;overflow-wrap:anywhere}
.cktext small{display:block;color:var(--muted);font-size:12px}
.ck.done .cktext{text-decoration:line-through;color:var(--muted)}
.cities{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.cityb{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;align-items:center}
.cityb .kj{font-family:var(--display);font-size:22px;font-weight:800;color:var(--c);line-height:1.2}
.cityb .nm{font-size:12px;font-weight:700}
.cityb[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.cityb[aria-pressed="true"] *{color:var(--onink)}
.tabs2{display:flex;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs2 button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-pressed="true"]{color:var(--shu);border-color:var(--shu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-block:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.list{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start}
.act.kept{border-color:var(--good)}
.act .title{background:none;border:0;padding:0;text-align:left;min-width:0}
.act h3{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.act .meta{margin-top:6px}
.stamp{width:48px;height:48px;border:2px solid var(--shu);color:var(--shu);border-radius:8px;display:grid;place-items:center;align-content:center;font-family:var(--display);font-weight:800;font-size:18px;transform:rotate(-6deg);font-variant-numeric:tabular-nums;line-height:1}
.stamp small{display:block;font-size:10px}
.stamp.zero{border-color:var(--line);color:var(--muted)}
.vote{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vote button{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 4px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.vote button i{font-style:normal;font-family:var(--display);font-size:16px}
.vote .up i{color:var(--good)} .vote .meh i{color:var(--meh)} .vote .down i{color:var(--bad)}
.vote button[aria-pressed="true"].up{background:var(--good);border-color:var(--good);color:var(--onink)}
.vote button[aria-pressed="true"].meh{background:var(--meh);border-color:var(--meh);color:var(--onink)}
.vote button[aria-pressed="true"].down{background:var(--bad);border-color:var(--bad);color:var(--onink)}
.vote button[aria-pressed="true"] i{color:var(--onink)}
.others{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.others b.up{color:var(--good)} .others b.meh{color:var(--meh)} .others b.down{color:var(--bad)}
.ai{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--shu);border-radius:8px;padding:10px 12px;margin-top:12px}
.day{display:grid;grid-template-columns:54px 1fr;gap:12px}
.dnum{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.dnum b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.dnum span{display:block;font-family:var(--display);font-size:18px;color:var(--muted)}
.dnum small{font-size:11px;color:var(--muted)}
.dbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.dinfo{font-size:13px;display:flex;flex-direction:column;gap:2px}
.slot{display:grid;grid-template-columns:78px 1fr;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.slot>span{font-size:12px;color:var(--muted)}
.slot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.slot li{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.slot li span{min-width:0;overflow-wrap:anywhere}
.slot li button.x{border:0;background:none;color:var(--muted);padding:0 4px}
.addslot{font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-align:left}
.load{font-size:12px;color:var(--muted)} .load.over{color:var(--bad);font-weight:700}
.mapwrap svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tfoot td{font-weight:800;border-bottom:0;font-size:16px}
.tablewrap{overflow-x:auto}
.flight{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;background:var(--soft);border-radius:8px;padding:12px;margin-bottom:12px}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal div{background:var(--soft);border-radius:8px;padding:10px;text-align:center}
.bal b{display:block;font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-top:14px}
.subnav button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.subnav button[aria-pressed="true"]{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.mn{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:9px;border-bottom:1px solid var(--line)}
.mn:last-child{border-bottom:0}
.mn small{display:block;color:var(--muted);font-size:13px}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;border:2px solid currentColor}
.mk.no{color:var(--bad)} .mk.yes{color:var(--good)}
.phr{display:grid;gap:2px;padding-block:10px;border-bottom:1px solid var(--line)}
.phr:last-child{border-bottom:0}
.phr .jp{font-family:var(--display);font-size:20px;font-weight:800}
.phr .ro{color:var(--shu);font-size:13px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.album img,.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;display:block}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bigimg{width:100%;border-radius:8px;max-height:60vh;object-fit:contain;background:var(--soft)}
.info h3{font-size:16px;margin-bottom:4px}
.info p,.info ul{margin:0;font-size:14px}
.info ul{padding-left:18px}
.copy{font-variant-numeric:tabular-nums;font-weight:700;user-select:all}
.exp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .ic{width:40px;height:40px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--shu)}
.exp small{display:block;color:var(--muted);font-size:12px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{border:1px solid var(--line);background:var(--washi);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end}
.stack{display:flex;flex-direction:column;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--sumi)}
.checks input{width:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:140px;border:0;background:none;padding:7px 2px 9px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
nav.tabs button b{font-family:var(--display);font-size:21px;font-weight:800;line-height:1.2}
nav.tabs button[aria-pressed="true"]{color:var(--shu)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--shu);color:var(--onink);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(15,10,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--paper);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:21px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.choice{display:grid;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--washi);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.choice button:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20}
.cm{font-size:14px;overflow-wrap:anywhere}
.cm b{font-size:12px;color:var(--shu);margin-right:6px}
.cmform{display:flex;gap:6px}
@media (max-width:420px){.cityb .kj{font-size:19px}.grid2{grid-template-columns:1fr}.count{font-size:44px}.flight{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.vote button{transition:background .15s,transform .1s}.vote button:active{transform:scale(.95)}}

/* ---- modern pass ---- */
:root{--shadow:0 1px 2px rgba(43,37,33,.05),0 10px 30px rgba(43,37,33,.07);--glass:rgba(255,251,243,.82)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--glass:rgba(34,30,36,.82)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--glass:rgba(34,30,36,.82)}
body{padding-block:0 130px;-webkit-font-smoothing:antialiased}
header.top{border-radius:0 0 26px 26px;padding:20px 16px 24px;box-shadow:var(--shadow)}
h1{font-size:25px;letter-spacing:.01em}
.hanko{width:46px;height:46px;font-size:21px}
.card{border-radius:16px;border-color:transparent;box-shadow:var(--shadow)}
.act.kept{box-shadow:var(--shadow),inset 0 0 0 1.5px var(--good)}
.empty{border-radius:16px}
.btn{border-radius:12px;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{border-color:var(--line)}
.chip{border-radius:999px;border-color:transparent;background:var(--soft);padding:2px 10px}
.chip.city,.chip.ok,.chip.todo{background:transparent;border-color:currentColor}
.hero{position:relative;overflow:hidden;background:var(--paper);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);margin-top:18px}
.hero::before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--shu);opacity:.13}
.hero>*{position:relative}

(function(){
  var cfg=window.FIREBASE_CONFIG||{};

  var ready=firebase.auth().signInAnonymously().then(function(c){window.__uid=c.user.uid;return c.user}).catch(function(e){console.error(e);return null});
  var fs=firebase.firestore();
  window.__flatUpdate=true; /* Firestore : update() remplace les objets imbriqués, on écrit votes.p1 au lieu de votes */

})();

function flat(o,pre,out){out=out||{};for(const k in o){const v=o[k],key=pre?pre+"."+k:k;if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length)flat(v,key,out);else out[key]=v}return out}
async function patch(col,id,data){if(live){try{await db.collection(col).doc(id).update(window.__flatUpdate?flat(data):data)}catch(e){fail(e)}}else{const a=S[col].find(x=>x.id===id);if(a)for(const k in data){const v=data[k];if(v&&typeof v==="object"&&!Array.isArray(v))a[k]={...(a[k]||{}),...v};else a[k]=v}refresh()}}
async function remove(col,id){if(live){try{await db.collection(col).doc(id).delete()}catch(e){fail(e)}}else{S[col]=S[col].filter(a=>a.id!==id);refresh()}}

document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();const fd=new FormData(f);const g=k=>String(fd.get(k)??"").trim();const id=f.dataset.id;
  if(f.classList.contains("cmform")){const txt=g("t");if(!txt)return;if(!me){pickMe();return}save("comments",newId("c"),{act:f.dataset.act,by:me,text:txt,at:Date.now()});f.reset();document.activeElement&&document.activeElement.blur();return}
  if(f.id==="actForm"){const base=id?S.activities.find(a=>a.id===id):null;
    const data={kind:f.dataset.kind||"act",city:g("city"),title:g("title"),type:g("type"),hours:num(g("hours")),priceYen:num(g("priceYen")),booking:g("booking"),bookBy:g("bookBy"),link:g("link"),notes:g("notes"),crowd:num(g("crowd"))};if(!data.title)return;
    if(base){const {id:_,...rest}=base;save("activities",id,{...rest,...data})}else save("activities",newId("a"),{...data,by:me||"p1",votes:me?{[me]:"up"}:{},day:"",slot:"",createdAt:Date.now()});
    city=data.city;kind=data.kind;closeSheet();if(tab!=="acts")setTab("acts");else render();toast(base?"Modifié":"Ajouté avec ton « J'adore »");return}
  if(f.id==="trForm"){save("transports",id||newId("t"),{from:g("from"),to:g("to"),date:g("date"),time:g("time"),mode:g("mode"),priceYen:num(g("priceYen")),ref:g("ref"),notes:"",booked:g("booked")==="1"});closeSheet();toast("Trajet enregistré");return}
  if(f.id==="hoForm"){const data={city:g("city"),name:g("name"),address:g("address"),checkin:g("checkin"),checkout:g("checkout"),priceYen:num(g("priceYen")),ref:g("ref"),link:g("link"),booked:g("booked")==="1"};if(!data.name)return;save("hotels",id||newId("h"),data);closeSheet();toast("Hôtel enregistré");return}
  if(f.id==="ckForm"){const base=id?S.checklist.find(x=>x.id===id):null;const data={text:g("text"),cat:g("cat"),who:g("who"),due:g("due")};if(!data.text)return;
    save("checklist",id||newId("k"),{done:false,doneBy:"",notes:"",createdAt:Date.now(),...(base?(({id:_,...r})=>r)(base):{}),...data});closeSheet();toast("Tâche enregistrée");return}
  if(f.id==="expForm"){const split=fd.getAll("split").map(String);const data={label:g("label"),amountYen:Number(g("amountYen"))||0,paidBy:g("paidBy"),split:split.length?split:[...PEOPLE],date:g("date"),city:g("city")};if(!data.label)return;
    const base=id?S.expenses.find(x=>x.id===id):null;save("expenses",id||newId("e"),{at:base?base.at:Date.now(),by:me||"",...data});closeSheet();toast("Dépense enregistrée");return}
});
$("#importInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- boot ---------- */
render();
(async()=>{
  const use=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};
  let userNs;[db,sampleFn,downloads,userNs]=await Promise.all([use("db"),use("sample"),use("downloads"),use("user")]);
  if(!db){render();const b=$("#banner");b.hidden=false;b.textContent="Mode aperçu : la base Firebase n'est pas encore configurée (voir config.js), rien n'est enregistré.";return}
  live=true;
  isAdmin=true;
  render();
  COLS.forEach(col=>db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>toast("Connexion perdue, recharge la page")));
  db.doc("trip/settings").onSnapshot(s=>{if(s.exists){const d=s.data();settings={...DEFAULT_SETTINGS,...d,names:{...DEFAULT_SETTINGS.names,...(d.names||{})},stays:{...DEFAULT_SETTINGS.stays,...(d.stays||{})}}}refresh()});
  db.doc("trip/notes").onSnapshot(s=>{notes=s.exists?String(s.data().text||""):"";refresh()});
  if(!me)pickMe();
})();
})();
</script>

</body></html>
